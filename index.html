<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utkristh Weds Kriti | Royal Wedding Invitation (Nov 30 – Dec 2, 2026)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            damaskBase: '#DFB695',
            damaskDeep: '#C99870',
            ivoryCard: '#FFFBF5',
            ivoryWarm: '#F9F1E4',
            goldRoyal: '#B6843A',
            goldBright: '#D4A857',
            goldDark: '#8A5E1B',
            bronzeText: '#5C3A21',
            maroonAccent: '#7A2021',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            cinzelDec: ['Cinzel Decorative', 'serif'],
            cormorant: ['Cormorant Garamond', 'serif'],
            script: ['Great Vibes', 'cursive'],
            hindi: ['Tiro Devanagari Hindi', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    };

    // Immediate global handler for opening the invitation gate
    window.openRoyalInvitation = function(withMusic) {
      var gate = document.getElementById('gate-overlay');
      if (gate) {
        gate.classList.add('gate-open');
        setTimeout(function() {
          gate.style.display = 'none';
        }, 700);
      }
      try {
        if (typeof window.triggerPetalBurst === 'function') {
          window.triggerPetalBurst(36);
        }
      } catch (e) {}
      try {
        if (withMusic && typeof window.startRaagYamanAudio === 'function') {
          window.startRaagYamanAudio();
        }
      } catch (e) {}
    };

    // Universal Directions handler that guarantees opening Google Maps
    window.openDirections = function(e, url, venueName) {
      if (e) {
        e.stopPropagation();
      }
      try {
        var newWin = window.open(url, '_blank', 'noopener,noreferrer');
        if (newWin) {
          newWin.opener = null;
          return false;
        }
      } catch (err) {}
      // Fallback if inside a restricted preview iframe
      try {
        window.top.location.href = url;
      } catch (err2) {
        window.location.href = url;
      }
      return true;
    };
  </script>

  <style>
    :root {
      --bg-damask: #DFB695;
      --card-ivory: #FFFBF4;
      --gold-primary: #B6843A;
      --gold-light: #DFB76C;
      --gold-dark: #875C1D;
      --text-brown: #5A3B22;
    }

    body {
      background-color: var(--bg-damask);
      color: var(--text-brown);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    /* Authentic Indian Damask Floral Pattern Backdrop */
    .damask-bg {
      background-color: #DFB695;
      background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23F3DAC2' fill-opacity='0.44'%3E%3Cpath d='M60 10 C65 25 80 28 92 20 C84 35 90 48 108 52 C90 56 84 69 92 84 C80 76 65 79 60 96 C55 79 40 76 28 84 C36 69 30 56 12 52 C30 48 36 35 28 20 C40 28 55 25 60 10 Z'/%3E%3Cpath d='M60 28 C63 38 72 42 80 38 C74 46 78 52 88 52 C78 52 74 58 80 66 C72 62 63 66 60 76 C57 66 48 62 40 66 C46 58 42 52 32 52 C42 52 46 46 40 38 C48 42 57 38 60 28 Z' fill='%23C9976E' fill-opacity='0.28'/%3E%3Ccircle cx='60' cy='52' r='5' fill='%23FFF5EB' fill-opacity='0.5'/%3E%3Ccircle cx='0' cy='0' r='16'/%3E%3Ccircle cx='120' cy='0' r='16'/%3E%3Ccircle cx='0' cy='120' r='16'/%3E%3Ccircle cx='120' cy='120' r='16'/%3E%3C/g%3E%3C/svg%3E");
      background-attachment: fixed;
    }

    /* Shimmering Gold Foil Typography */
    .gold-foil-text {
      background: linear-gradient(135deg, #7B5014 0%, #B88738 25%, #DFB86B 50%, #B38030 75%, #754A10 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shineGold 6s linear infinite;
    }

    @keyframes shineGold {
      to { background-position: 200% center; }
    }

    /* Gentle Pendulum Sway for Symmetrical Hanging Jhumars */
    @keyframes swaySlow {
      0%, 100% { transform: rotate(-2.2deg); }
      50% { transform: rotate(2.2deg); }
    }
    .jhumar-sway-a {
      transform-origin: top center;
      animation: swaySlow 4.8s ease-in-out infinite;
    }
    .jhumar-sway-b {
      transform-origin: top center;
      animation: swaySlow 5.6s ease-in-out infinite reverse;
    }

    /* Royal Gate Opening Transition */
    #gate-overlay {
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    #gate-overlay.gate-open {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #gate-overlay.gate-open .gate-left {
      transform: translateX(-100%);
    }
    #gate-overlay.gate-open .gate-right {
      transform: translateX(100%);
    }
    .gate-door {
      transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    }

    /* Dotted leader line for ceremony times */
    .dotted-leader {
      flex-grow: 1;
      border-bottom: 2px dotted #B6843A;
      margin: 0 10px;
      position: relative;
      top: -5px;
      opacity: 0.65;
    }

    /* Floating Petal Canvas */
    #petal-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none !important;
      z-index: 35;
    }
  </style>
</head>
